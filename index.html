<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JULMORDET</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #081018;
    color: white;
    font-family: Inter, sans-serif;
}

/* =========================
   HUVUDSCEN
========================= */

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;

    background:
        linear-gradient(
            rgba(7, 15, 23, 0.15),
            rgba(5, 12, 18, 0.55)
        ),
        linear-gradient(
            to bottom,
            #101d2b 0%,
            #182c3b 48%,
            #9caeb5 100%
        );
}

/* =========================
   MÅNE
========================= */

.moon {
    position: absolute;

    width: 150px;
    height: 150px;

    right: 13%;
    top: 11%;

    border-radius: 50%;

    background: #f4f0d8;

    box-shadow:
        0 0 30px rgba(255,245,205,.25),
        0 0 100px rgba(255,245,205,.10);
}

/* =========================
   TRÄD
========================= */

.trees {
    position: absolute;

    bottom: 27%;
    left: 0;

    width: 100%;
    height: 260px;

    opacity: .55;
}

.tree {
    position: absolute;

    bottom: 0;

    width: 0;
    height: 0;

    border-left: 45px solid transparent;
    border-right: 45px solid transparent;
    border-bottom: 150px solid #10212a;
}

.tree:nth-child(1) {
    left: 4%;
    transform: scale(.8);
}

.tree:nth-child(2) {
    left: 13%;
    transform: scale(1.1);
}

.tree:nth-child(3) {
    left: 24%;
    transform: scale(.7);
}

.tree:nth-child(4) {
    right: 25%;
    transform: scale(.9);
}

.tree:nth-child(5) {
    right: 13%;
    transform: scale(1.2);
}

.tree:nth-child(6) {
    right: 3%;
    transform: scale(.75);
}

/* =========================
   SNÖMARK
========================= */

.snow-hill {
    position: absolute;

    bottom: -20%;
    left: -10%;

    width: 120%;
    height: 48%;

    background: #dfe7e8;

    border-radius: 50% 50% 0 0;

    box-shadow:
        inset 0 20px 35px rgba(255,255,255,.35);
}

/* =========================
   STUGA
========================= */

.cabin {
    position: absolute;

    left: 50%;
    bottom: 18%;

    width: 510px;
    height: 350px;

    transform: translateX(-50%);

    z-index: 10;
}

/* Hus */

.house {
    position: absolute;

    left: 55px;
    bottom: 0;

    width: 400px;
    height: 210px;

    background:
        repeating-linear-gradient(
            to bottom,
            #55382c 0px,
            #55382c 13px,
            #472f26 14px,
            #472f26 17px
        );

    border: 3px solid #34231d;

    box-shadow:
        0 30px 45px rgba(0,0,0,.35);
}

/* Tak */

.roof {
    position: absolute;

    left: 20px;
    top: 32px;

    width: 470px;
    height: 150px;

    background: #302725;

    transform: skewX(-28deg);

    border: 3px solid #211c1a;

    box-shadow:
        0 20px 25px rgba(0,0,0,.35);
}

/* Snö på taket */

.roof-snow {
    position: absolute;

    left: 10px;
    top: 22px;

    width: 490px;
    height: 28px;

    background: #eef2f0;

    transform: skewX(-28deg);

    border-radius: 20px;

    box-shadow:
        0 7px 12px rgba(0,0,0,.15);
}

/* =========================
   FÖNSTER
========================= */

.window {
    position: absolute;

    top: 48px;

    width: 82px;
    height: 82px;

    background:
        radial-gradient(
            circle,
            #ffd978 0%,
            #eab957 55%,
            #b47c30 100%
        );

    border: 6px solid #30231e;

    box-shadow:
        0 0 35px rgba(255,190,70,.45);
}

.window.left {
    left: 42px;
}

.window.right {
    right: 42px;
}

.window::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    width: 5px;
    height: 100%;

    background: #30231e;

    transform: translateX(-50%);
}

.window::after {
    content: "";

    position: absolute;

    left: 0;
    top: 50%;

    width: 100%;
    height: 5px;

    background: #30231e;

    transform: translateY(-50%);
}

/* =========================
   DÖRR
========================= */

.door {
    position: absolute;

    left: 160px;
    bottom: 0;

    width: 80px;
    height: 140px;

    background:
        linear-gradient(
            90deg,
            #281b17,
            #3b261f,
            #281b17
        );

    border: 5px solid #211714;
}

.handle {
    position: absolute;

    right: 10px;
    top: 68px;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #c9a85d;
}

/* =========================
   TITEL
========================= */

.title {
    position: absolute;

    top: 10%;
    left: 50%;

    transform: translateX(-50%);

    text-align: center;

    z-index: 50;
}

.title h1 {
    font-family: Cinzel, serif;

    font-size: clamp(54px, 8vw, 108px);

    font-weight: 500;

    letter-spacing: .18em;

    margin-right: -.18em;

    text-shadow:
        0 3px 25px rgba(0,0,0,.65);
}

.title p {
    margin-top: 18px;

    font-size: 14px;

    letter-spacing: .34em;

    text-transform: uppercase;

    color: rgba(255,255,255,.85);
}

/* =========================
   START-KNAPP
========================= */

.intro-buttons {
    position: absolute;

    left: 50%;
    bottom: 8%;

    transform: translateX(-50%);

    z-index: 60;
}

.start-button {
    min-width: 230px;

    padding: 18px 42px;

    border: 1px solid rgba(255,255,255,.65);

    border-radius: 3px;

    background:
        rgba(18,29,36,.72);

    backdrop-filter: blur(8px);

    color: white;

    font-family: Inter, sans-serif;

    font-size: 13px;

    font-weight: 500;

    letter-spacing: .35em;

    text-indent: .35em;

    cursor: pointer;

    transition:
        background .3s ease,
        color .3s ease,
        transform .3s ease,
        box-shadow .3s ease;
}

.start-button:hover {
    background: rgba(255,255,255,.92);

    color: #18232b;

    transform: translateY(-3px);

    box-shadow:
        0 12px 30px rgba(0,0,0,.3);
}

/* =========================
   SNÖ
========================= */

.snow {
    position: absolute;

    inset: -100px;

    pointer-events: none;

    background-image:
        radial-gradient(
            circle,
            white 1px,
            transparent 2px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.8) 1.5px,
            transparent 2.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.55) 2px,
            transparent 3px
        );

    background-size:
        80px 80px,
        130px 130px,
        190px 190px;

    animation:
        snowfall 18s linear infinite;

    opacity: .8;

    z-index: 70;
}

@keyframes snowfall {

    from {
        transform: translateY(-20px);
    }

    to {
        transform: translateY(160px);
    }
}

/* =========================
   MÖRK KANT
========================= */

.vignette {
    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.45) 100%
        );

    z-index: 80;
}

/* =========================
   MOBIL
========================= */

@media (max-width: 700px) {

    .moon {
        width: 90px;
        height: 90px;

        right: 8%;
        top: 8%;
    }

    .cabin {
        transform:
            translateX(-50%)
            scale(.72);

        bottom: 15%;
    }

    .title {
        top: 12%;
        width: 95%;
    }

    .title h1 {
        font-size: 45px;
        letter-spacing: .12em;
    }

    .title p {
        font-size: 10px;
        letter-spacing: .2em;
    }

    .start-button {
        min-width: 200px;
    }
}

</style>
</head>

<body>

<div class="scene">

    <!-- Måne -->
    <div class="moon"></div>

    <!-- Träd -->
    <div class="trees">
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
        <div class="tree"></div>
    </div>

    <!-- Titel -->
    <div class="title">

        <h1>JULMORDET</h1>

        <p>
            Kan du lösa mordet på 24 dagar?
        </p>

    </div>

    <!-- Stuga -->
    <div class="cabin">

        <div class="roof"></div>

        <div class="roof-snow"></div>

        <div class="house">

            <div class="window left"></div>

            <div class="window right"></div>

            <div class="door">

                <div class="handle"></div>

            </div>

        </div>

    </div>

    <!-- Snö -->
    <div class="snow-hill"></div>

    <div class="snow"></div>

    <!-- Start -->
    <div class="intro-buttons">

        <button
            class="start-button"
            onclick="startGame()"
        >
            STARTA
        </button>

    </div>

    <!-- Vinjett -->
    <div class="vignette"></div>

</div>

<script>

function startGame() {

    alert("Spelet börjar snart...");

}

</script>

</body>
</html>
