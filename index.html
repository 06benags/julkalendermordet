<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JULMORDET</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background: #101820;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background:
        linear-gradient(
          to bottom,
          rgba(10, 20, 30, 0.15),
          rgba(5, 12, 18, 0.55)
        ),
        linear-gradient(
          to bottom,
          #182b3a 0%,
          #294052 48%,
          #d9e1e3 100%
        );
    }

    /* Måne */
    .moon {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #f4f0dc;
      top: 10%;
      right: 13%;
      box-shadow: 0 0 45px rgba(255, 248, 220, 0.25);
    }

    /* Snömark */
    .snow-ground {
      position: absolute;
      bottom: -10%;
      left: -5%;
      width: 110%;
      height: 48%;
      background: #edf2f1;
      border-radius: 50% 50% 0 0;
      box-shadow: 0 -20px 50px rgba(255,255,255,0.18);
    }

    /* Huset */
    .cabin {
      position: absolute;
      left: 50%;
      bottom: 18%;
      transform: translateX(-50%);
      width: 430px;
      height: 270px;
    }

    .house {
      position: absolute;
      bottom: 0;
      left: 40px;
      width: 350px;
      height: 190px;
      background: #5b3b2d;
      border: 4px solid #3d2920;
      box-shadow: 0 20px 35px rgba(0,0,0,0.3);
    }

    /* Tak */
    .roof {
      position: absolute;
      top: -105px;
      left: -35px;
      width: 420px;
      height: 150px;
      background: #3b302c;
      border: 4px solid #2a2321;
      transform: skewX(-28deg);
      box-shadow: 0 12px 20px rgba(0,0,0,0.25);
    }

    .snow-roof {
      position: absolute;
      top: -112px;
      left: -42px;
      width: 430px;
      height: 32px;
      background: #f4f6f5;
      transform: skewX(-28deg);
      border-radius: 12px;
    }

    /* Dörr */
    .door {
      position: absolute;
      bottom: 0;
      left: 145px;
      width: 72px;
      height: 125px;
      background: #38251e;
      border: 4px solid #281b17;
    }

    .door-handle {
      position: absolute;
      right: 10px;
      top: 65px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c8a85b;
    }

    /* Fönster */
    .window {
      position: absolute;
      width: 72px;
      height: 72px;
      top: 42px;
      background: #e7bd63;
      border: 6px solid #33251f;
      box-shadow: 0 0 28px rgba(255, 191, 75, 0.55);
    }

    .window.left {
      left: 35px;
    }

    .window.right {
      right: 35px;
    }

    .window::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 5px;
      height: 100%;
      background: #33251f;
      transform: translateX(-50%);
    }

    .window::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 5px;
      background: #33251f;
      transform: translateY(-50%);
    }

    /* Text */
    .title {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: white;
      letter-spacing: 0.18em;
      text-shadow: 0 3px 18px rgba(0,0,0,0.6);
    }

    .title h1 {
      margin: 0;
      font-size: clamp(52px, 9vw, 110px);
      font-weight: 400;
    }

    .title p {
      margin: 15px 0 0;
      font-family: Arial, sans-serif;
      font-size: clamp(13px, 1.6vw, 19px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    /* Snö */
    .snow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,0.7) 1px, transparent 2px);
      background-size: 90px 90px, 45px 45px;
      animation: snowfall 14s linear infinite;
    }

    @keyframes snowfall {
      from {
        background-position: 0 0, 0 0;
      }
      to {
        background-position: 100px 700px, -80px 500px;
      }
    }

  </style>
</head>

<body>

  <main class="hero">

    <div class="moon"></div>

    <div class="title">
      <h1>JULMORDET</h1>
      <p>Kan du lösa mordet på 24 dagar?</p>
    </div>

    <div class="cabin">
      <div class="roof"></div>
      <div class="snow-roof"></div>

      <div class="house">
        <div class="window left"></div>
        <div class="window right"></div>

        <div class="door">
          <div class="door-handle"></div>
        </div>
      </div>
    </div>

    <div class="snow-ground"></div>
    <div class="snow"></div>

  </main>

</body>
</html>
