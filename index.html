<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Julmordet</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Inter, sans-serif;
    color: #fff;

    background:
        radial-gradient(circle at 50% 0%, #29452f 0%, transparent 45%),
        linear-gradient(135deg, #10251b, #183527 55%, #0b1812);

    overflow-x: hidden;
}

/* =========================
   SNÖ
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    pointer-events: none;

    background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 1px, transparent 2px),
        radial-gradient(circle, rgba(255,255,255,.7) 1.5px, transparent 2.5px);

    background-size:
        80px 80px,
        140px 140px;

    animation: snow 18s linear infinite;

    opacity: .45;
}

@keyframes snow {
    from {
        background-position: 0 0, 40px 0;
    }

    to {
        background-position: 80px 500px, -40px 600px;
    }
}

/* =========================
   HEADER
========================= */

header {
    text-align: center;
    padding: 55px 20px 35px;
}

h1 {
    font-family: Cinzel, serif;
    font-size: clamp(42px, 7vw, 76px);
    font-weight: 500;
    letter-spacing: .12em;
}

.subtitle {
    margin-top: 14px;
    font-size: 14px;
    letter-spacing: .15em;
    opacity: .75;
}

/* =========================
   KALENDER
========================= */

.calendar {
    width: min(1100px, 92%);
    margin: 20px auto 70px;

    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 18px;
}

/* =========================
   LUCKOR
========================= */

.door {
    position: relative;

    aspect-ratio: 1 / 1.15;

    border: 1px solid rgba(255,255,255,.3);

    border-radius: 8px;

    background:
        linear-gradient(
            145deg,
            #a92e35,
            #7e2029
        );

    box-shadow:
        0 12px 25px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.18);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.door::before {
    content: "";

    position: absolute;
    inset: 7px;

    border: 1px solid rgba(255,255,255,.18);

    border-radius: 5px;
}

.door:hover {
    transform: translateY(-6px) scale(1.02);

    box-shadow:
        0 18px 35px rgba(0,0,0,.35),
        0 0 25px rgba(255,220,170,.12);
}

.number {
    position: relative;
    z-index: 2;

    font-family: Cinzel, serif;

    font-size: clamp(28px, 4vw, 45px);

    font-weight: 500;

    color: #fff8e9;

    text-shadow:
        0 2px 5px rgba(0,0,0,.25);
}

/* =========================
   JULDETALJ
========================= */

.door:nth-child(3n) {
    background:
        linear-gradient(
            145deg,
            #b38a3d,
            #866324
        );
}

.door:nth-child(5n) {
    background:
        linear-gradient(
            145deg,
            #315c40,
            #20432e
        );
}

/* =========================
   RESPONSIV
========================= */

@media (max-width: 850px) {

    .calendar {
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
    }
}

@media (max-width: 520px) {

    header {
        padding-top: 35px;
    }

    .calendar {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
    }

    .subtitle {
        font-size: 11px;
    }
}

</style>
</head>

<body>

<header>

    <h1>JULMORDET</h1>

    <div class="subtitle">
        Kan du lösa mordet på 24 dagar?
    </div>

</header>

<main class="calendar" id="calendar">

</main>

<script>

const calendar = document.getElementById("calendar");

for (let i = 1; i <= 24; i++) {

    const door = document.createElement("button");

    door.className = "door";

    door.innerHTML = `
        <span class="number">${i}</span>
    `;

    /* ENDAST LUCKA 1 ÄR KLICKBAR */
    if (i === 1) {

        door.addEventListener("click", () => {
            alert("Lucka 1 öppnas...");
        });

    } else {

        door.style.cursor = "default";

    }

    calendar.appendChild(door);
}

</script>

</body>
</html>
