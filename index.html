<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10251b">
<title>Julmordet – Adventskalender</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0%,#29452f 0%,transparent 45%),linear-gradient(135deg,#10251b,#183527 55%,#0b1812);overflow-x:hidden}
#snowfall{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:10;opacity:.65}
.snowflake{position:absolute;top:-10vh;left:var(--left);font-size:var(--size);opacity:var(--opacity);color:#fff;line-height:1;user-select:none;animation:fall var(--duration) var(--delay) linear infinite;text-shadow:0 0 4px #fff8}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0)}25%{transform:translate3d(var(--drift1),25vh,0) rotate(55deg)}55%{transform:translate3d(var(--drift2),58vh,0) rotate(120deg)}100%{transform:translate3d(var(--drift3),112vh,0) rotate(210deg)}}
header{text-align:center;padding:55px 18px 22px}
h1{font-family:Cinzel,Georgia,serif;font-size:clamp(38px,7vw,72px);font-weight:500;letter-spacing:.12em;text-shadow:0 4px 24px #0006}
.subtitle{margin-top:13px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.78}
.calendar{width:min(1050px,92%);margin:30px auto 65px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.door{position:relative;aspect-ratio:1/1.13;border:1px solid #ffffff65;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 12px 25px #0004,inset 0 1px #ffffff35;transition:transform .22s,box-shadow .22s;isolation:isolate;overflow:hidden}
.door:before{content:"";position:absolute;inset:7px;border:1px solid #ffffff45;border-radius:5px;pointer-events:none}
.door:after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,#ffffff18,transparent 40%,#0002);z-index:-1}
.door:hover,.door:focus-visible{transform:translateY(-6px) scale(1.025);box-shadow:0 18px 35px #0006,0 0 25px #ffdcaa24;outline:2px solid #fff8;outline-offset:3px}
.number{font-family:Cinzel,Georgia,serif;font-size:clamp(28px,4vw,46px);font-weight:500;color:#fff8e9;text-shadow:0 2px 5px #0005;z-index:1}
.door-label{position:absolute;bottom:12px;z-index:1;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#fff;opacity:.8}
.door:nth-child(6n+1){background:linear-gradient(145deg,#b53b42,#7e2029)}
.door:nth-child(6n+2){background:linear-gradient(145deg,#315f43,#1e402d)}
.door:nth-child(6n+3){background:linear-gradient(145deg,#c49b4b,#876323)}
.door:nth-child(6n+4){background:linear-gradient(145deg,#315c7a,#1b354d)}
.door:nth-child(6n+5){background:linear-gradient(145deg,#8b477d,#54294f)}
.door:nth-child(6n){background:linear-gradient(145deg,#c06e36,#82401f)}
footer{text-align:center;padding:0 16px 28px;color:#ffffff8a;font-size:10px;letter-spacing:.14em}
@media(max-width:720px){header{padding-top:38px}.calendar{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.door-label{font-size:7px;letter-spacing:.1em}}
@media(max-width:420px){.calendar{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.door{aspect-ratio:1/1.08}.number{font-size:32px}}
@media(prefers-reduced-motion:reduce){.door{transition:none}.snowflake{animation-duration:45s}}
</style>
</head>
<body>
<div id="snowfall" aria-hidden="true"></div>
<header>
  <h1>Julmordet</h1>
  <p class="subtitle">24 dagar · 24 luckor · Ett ouppklarat dödsfall</p>
</header>
<main>
  <div class="calendar" id="calendar" aria-label="Adventskalender med 24 luckor"></div>
</main>
<footer>ETT FIKTIVT KRIMINALFALL · VARGMYREN · DECEMBER 2014</footer>
<script>
const snow=document.getElementById('snowfall');
const symbols=['❄','✦','❅','·'];
for(let i=0;i<70;i++){
  const flake=document.createElement('span');
  flake.className='snowflake';
  flake.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  flake.style.setProperty('--left',Math.random()*100+'%');
  flake.style.setProperty('--size',(7+Math.random()*14)+'px');
  flake.style.setProperty('--opacity',(0.25+Math.random()*0.65).toFixed(2));
  flake.style.setProperty('--duration',(12+Math.random()*22)+'s');
  flake.style.setProperty('--delay',(-Math.random()*32)+'s');
  flake.style.setProperty('--drift1',(Math.random()*80-40)+'px');
  flake.style.setProperty('--drift2',(Math.random()*120-60)+'px');
  flake.style.setProperty('--drift3',(Math.random()*100-50)+'px');
  snow.appendChild(flake);
}
const calendar=document.getElementById('calendar');
for(let day=1;day<=24;day++){
  const door=document.createElement('button');
  door.type='button';
  door.className='door';
  door.setAttribute('aria-label','Lucka '+day);
  door.innerHTML='<span class="number">'+String(day).padStart(2,'0')+'</span><span class="door-label">Lucka</span>';
  // Luckorna är visuella tills innehållet till varje dag är färdigställt.
  calendar.appendChild(door);
}
</script>
</body>
</html>
