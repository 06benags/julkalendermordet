<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JULMORDET</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@300;400;500&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #081018;
    color: white;
    font-family: Inter, sans-serif;
}

/* =========================
   BAKGRUND
========================= */

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(50, 76, 94, 0.35),
            transparent 38%
        ),
        linear-gradient(
            to bottom,
            #08131f 0%,
            #101f2d 48%,
            #182b38 100%
        );
}

/* =========================
   MÅNE
========================= */

.moon {
    position: absolute;

    width: 165px;
    height: 165px;

    top: 14%;
    left: 50%;

    transform: translateX(-50%);

    border-radius: 50%;

    background: #f3efd9;

    box-shadow:
        0 0 30px rgba(255, 247, 215, 0.25),
        0 0 90px rgba(255, 247, 215, 0.12),
        0 0 150px rgba(255, 247, 215, 0.05);
}

/* =========================
   MÅNENS LÄTTA MOLN
========================= */

.moon-glow {
    position: absolute;

    width: 500px;
    height: 240px;

    top: 9%;
    left: 50%;

    transform: translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(190, 207, 216, 0.10),
            transparent 70%
        );

    filter: blur(18px);

    pointer-events: none;
}

/* =========================
   TEXT
========================= */

.title {
    position: absolute;

    top: 43%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 100%;

    text-align: center;

    z-index: 10;
}

.title h1 {
    font-family: Cinzel, serif;

    font-size: clamp(58px, 9vw, 120px);

    font-weight: 500;

    letter-spacing: 0.17em;

    margin-right: -0.17em;

    color: #f4f1e8;

    text-shadow:
        0 3px 25px rgba(0,0,0,0.55);
}

.divider {
    width: 100px;
    height: 1px;

    margin: 24px auto 20px;

    background: rgba(255,255,255,0.55);
}

.title p {
    font-size: 13px;

    font-weight: 300;

    letter-spacing: 0.32em;

    text-transform: uppercase;

    color: rgba(255,255,255,0.82);
}

/* =========================
   START-KNAPP
========================= */

.intro-buttons {
    position: absolute;

    left: 50%;
    bottom: 12%;

    transform: translateX(-50%);

    z-index: 20;
}

.start-button {
    min-width: 220px;

    padding: 17px 42px;

    border: 1px solid rgba(255,255,255,0.55);

    border-radius: 2px;

    background: rgba(8,18,27,0.45);

    backdrop-filter: blur(8px);

    color: white;

    font-family: Inter, sans-serif;

    font-size: 12px;

    font-weight: 400;

    letter-spacing: 0.35em;

    text-indent: 0.35em;

    cursor: pointer;

    transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.3s ease,
        border-color 0.3s ease;
}

.start-button:hover {
    background: rgba(255,255,255,0.92);

    color: #101c26;

    border-color: white;

    transform: translateY(-2px);
}

/* =========================
   SNÖ
========================= */

.snow {
    position: absolute;

    inset: -100px;

    pointer-events: none;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,0.9) 1px,
            transparent 2px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,0.65) 1.5px,
            transparent 2.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,0.45) 2px,
            transparent 3px
        );

    background-size:
        75px 75px,
        130px 130px,
        210px 210px;

    animation:
        snowfall 20s linear infinite;

    opacity: 0.75;

    z-index: 30;
}

@keyframes snowfall {

    from {
        transform: translate3d(0, -30px, 0);
    }

    to {
        transform: translate3d(80px, 180px, 0);
    }
}

/* =========================
   MÖRK KANT
========================= */

.vignette {
    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 38%,
            rgba(0,0,0,0.42) 100%
        );

    z-index: 40;
}

/* =========================
   MOBIL
========================= */

@media (max-width: 700px) {

    .moon {
        width: 105px;
        height: 105px;

        top: 13%;
    }

    .title {
        top: 43%;
    }

    .title h1 {
        font-size: 46px;

        letter-spacing: 0.11em;

        margin-right: -0.11em;
    }

    .title p {
        font-size: 9px;

        letter-spacing: 0.20em;

        padding: 0 20px;
    }

    .divider {
        margin: 18px auto;
    }

    .start-button {
        min-width: 190px;
    }
}

</style>
</head>

<body>

<div class="scene">

    <!-- Måne -->
    <div class="moon"></div>

    <!-- Månens ljus -->
    <div class="moon-glow"></div>

    <!-- Titel -->
    <div class="title">

        <h1>JULMORDET</h1>

        <div class="divider"></div>

        <p>
            Kan du lösa mordet på 24 dagar?
        </p>

    </div>

    <!-- Start -->
    <div class="intro-buttons">

        <button
            class="start-button"
            onclick="startGame()"
        >
            STARTA
        </button>

    </div>

    <!-- Snö -->
    <div class="snow"></div>

    <!-- Mörka kanter -->
    <div class="vignette"></div>

</div>

<script>

function startGame() {

    alert("Spelet börjar snart...");

}

</script>

</body>
</html>
